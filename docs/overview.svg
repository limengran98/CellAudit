<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">CellAudit workflow</title>
  <desc id="desc">A four-stage workflow from agentic discovery through source checking and behavioral audit to held-out replication.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#173B57"/>
      <stop offset="1" stop-color="#176B73"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#173B57" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6B7F8C"/>
    </marker>
  </defs>

  <rect width="1120" height="300" rx="18" fill="#F7FAFB"/>
  <rect x="24" y="20" width="1072" height="54" rx="12" fill="url(#header)"/>
  <text x="560" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Discover a model, freeze it, and test what it uses</text>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <g transform="translate(34 104)">
      <rect width="232" height="132" rx="14" fill="#E6F1F5" stroke="#77A9BC" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="18" fill="#277DA1"/>
      <text x="32" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
      <text x="60" y="29" font-size="18" font-weight="700" fill="#173B57">Agentic discovery</text>
      <text x="20" y="67" font-size="14" fill="#344B5A">Propose and train candidates</text>
      <text x="20" y="91" font-size="14" fill="#344B5A">under one task contract</text>
      <rect x="20" y="106" width="116" height="6" rx="3" fill="#277DA1"/>
      <rect x="142" y="106" width="32" height="6" rx="3" fill="#8FC4D4"/>
      <rect x="180" y="106" width="32" height="6" rx="3" fill="#C7DEE6"/>
    </g>

    <g transform="translate(307 104)">
      <rect width="232" height="132" rx="14" fill="#F1ECF7" stroke="#9B82B4" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="18" fill="#725A8C"/>
      <text x="32" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
      <text x="60" y="29" font-size="18" font-weight="700" fill="#49385C">Freeze receipts</text>
      <text x="20" y="67" font-size="14" fill="#4F4659">Bind source, checkpoint,</text>
      <text x="20" y="91" font-size="14" fill="#4F4659">claims, maps, and hashes</text>
      <path d="M22 108 h86 M22 114 h140 M22 120 h116" stroke="#725A8C" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(580 104)">
      <rect width="232" height="132" rx="14" fill="#FFF2E5" stroke="#DFA35C" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="18" fill="#D9822B"/>
      <text x="32" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
      <text x="60" y="29" font-size="18" font-weight="700" fill="#7D4515">Deterministic audit</text>
      <text x="20" y="67" font-size="14" fill="#604A38">Check executable paths and</text>
      <text x="20" y="91" font-size="14" fill="#604A38">matched input interventions</text>
      <circle cx="31" cy="113" r="7" fill="none" stroke="#D9822B" stroke-width="3"/>
      <path d="M36 118 l8 8" stroke="#D9822B" stroke-width="3" stroke-linecap="round"/>
      <path d="M63 114 h135" stroke="#D9822B" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g transform="translate(853 104)">
      <rect width="232" height="132" rx="14" fill="#EAF4EB" stroke="#78AA7E" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="18" fill="#4F8A59"/>
      <text x="32" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">4</text>
      <text x="60" y="29" font-size="18" font-weight="700" fill="#315D38">Held-out replication</text>
      <text x="20" y="67" font-size="14" fill="#405B44">Repeat frozen decisions on</text>
      <text x="20" y="91" font-size="14" fill="#405B44">an unopened data boundary</text>
      <path d="M24 118 l16 -16 13 11 22 -25 18 14 25 -31 21 18 24 -11 27 20" fill="none" stroke="#4F8A59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g stroke="#6B7F8C" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M270 170 H297"/>
    <path d="M543 170 H570"/>
    <path d="M816 170 H843"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#536773" text-anchor="middle">
    <text x="288" y="157">select</text>
    <text x="561" y="157">verify</text>
    <text x="834" y="157">replicate</text>
  </g>

  <text x="560" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#536773">Language models propose candidates; deterministic code evaluates scientific input-use claims after selection.</text>
</svg>
